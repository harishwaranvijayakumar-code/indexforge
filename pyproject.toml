
[project]
name = "indexforge"
version = "0.1.0"
description = "A reliable search-index management service."
requires-python = ">=3.13,<3.14"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_tests.py"]
testpaths = ["tests", "documents"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
